server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 10m;   # default; larger limits only where uploads are expected (the API enforces its own limits too)

  # Security headers are repeated in every location that sets its own add_header (nginx does not inherit them then).
  set $csp "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy $csp always;
  # Strict-Transport-Security belongs on the TLS-terminating proxy in front of this container (not used in the local edition: keep it on 127.0.0.1).

  # Lab terminals: WebSocket to the terminal gateway (lab profile). Resolved lazily so the UI still starts without it.
  location = /terminal/ws {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $terminal_gw http://terminal-gateway:8100;
    proxy_pass $terminal_gw;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
  # evidence uploads (setting evidence.max_upload_mb, default 512) and malware samples (malware.max_sample_mb, default 32)
  location /api/v1/forensics/ {
    client_max_body_size 520m;
    proxy_request_buffering off;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }
  location /api/v1/malware/ {
    client_max_body_size 40m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /api/v1/training/ {
    client_max_body_size 21m;   # challenge attachments (20 MB)
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $csp always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
